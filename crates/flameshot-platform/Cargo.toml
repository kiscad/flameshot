[package]
name = "flameshot-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
x11rb = { version = "0.13.2", features = ["randr"] }

zbus = { version = "5.19", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures-util = "0.3"
url = "2"
thiserror = "2"

flameshot-core = { path = "../flameshot-core" }
smithay-client-toolkit = { version = "0.19.2", default-features = false }
wayland-client = "0.31"

tempfile = "3"

[lints]
workspace = true
