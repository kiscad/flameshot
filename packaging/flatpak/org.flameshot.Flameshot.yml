app-id: org.flameshot.Flameshot
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: flameshot
finish-args:
  - --share=ipc
  # Keep X11 available for clipboard fallback on compositors without data-control.
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=xdg-pictures
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  # The currently published 26.08 rust-stable extension is older than our MSRV.
  # Build tools are pinned and removed from the resulting application payload.
  - name: rust-toolchain
    buildsystem: simple
    build-options:
      no-debuginfo: true
      strip: false
    build-commands:
      - ./install.sh --prefix=/app/lib/rust --disable-ldconfig --components="$(grep -E '^(rustc|cargo|rust-std-.*)$' components | paste -sd, -)"
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://static.rust-lang.org/dist/rust-1.99.1-x86_64-unknown-linux-gnu.tar.xz
        sha256: 231fcae47ee950621374725b5fc3b5441d2fbda2955ac45dd7dc816d8876cfe7
      - type: archive
        only-arches: [aarch64]
        url: https://static.rust-lang.org/dist/rust-1.99.1-aarch64-unknown-linux-gnu.tar.xz
        sha256: a48fb1e853be56ce9b8e2751f5464dbd5e16440cd81e237920f3a5e7e806333e
    cleanup:
      - /lib/rust
  - name: flameshot
    buildsystem: simple
    build-options:
      prepend-path: /app/lib/rust/bin
      env:
        CARGO_HOME: /run/build/flameshot/cargo-home
        CARGO_NET_OFFLINE: 'true'
        CARGO_INCREMENTAL: '0'
    build-commands:
      - cargo build --locked --offline --release -p flameshot --no-default-features --features imgur
      - DESTDIR="$PWD/package-stage" PREFIX=/app scripts/stage-rust.sh
      - cp -a package-stage/app/. "$FLATPAK_DEST/"
      - sed -i 's/^StartupWMClass=.*/StartupWMClass=org.flameshot.Flameshot/' "$FLATPAK_DEST/share/applications/org.flameshot.Flameshot.desktop"
    sources:
      # Generate with scripts/package-rust-source.sh beside a copy of this manifest.
      - type: archive
        path: flameshot-15.0.0-rust.tar.gz
